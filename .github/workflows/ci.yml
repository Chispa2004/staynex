name: Staynex CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staynex-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SEND_AUTOMATIONS: 'false'
  USE_MOCK_AI: 'true'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  critical:
    name: Critical tests and syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            dashboard/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix dashboard ci --ignore-scripts --no-audit --no-fund
      - run: npm run ci:critical

  dashboard:
    name: Dashboard build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            dashboard/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix dashboard ci --ignore-scripts --no-audit --no-fund
      - run: npm run ci:dashboard
      - run: npx --no-install playwright install --with-deps chromium
      - name: Production theme and contrast regressions
        run: npm run test:theme-browser
      - name: Production density and excluded-layout regressions
        run: npm run test:density-browser
      - name: Production names keyboard and focus regressions
        run: npm run test:accessibility-browser
      - name: Production Inbox selection history and refresh regressions
        run: npm run test:inbox-stability-browser
      - name: Dashboard pending tickets layout keyboard and isolation regressions
        run: npm run test:dashboard-pending-browser
      - name: Dashboard initial loading and demo message scope regressions
        run: npm run test:dashboard-demo-browser
      - name: Attention lifecycle confirmation and grouping regressions
        run: npm run test:attention-lifecycle-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-theme-evidence
          path: |
            .npm-cache/attention-lifecycle-browser-results
            .npm-cache/theme-browser-results
            .npm-cache/density-browser-results
            .npm-cache/accessibility-browser-results
            .npm-cache/inbox-stability-results
            .npm-cache/pending-ticket-browser-results
            .npm-cache/dashboard-demo-browser-results
          include-hidden-files: true
          retention-days: 7

  postgres:
    name: PostgreSQL knowledge and automation dispatch
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: docker pull postgres:17.10
      - run: npm run ci:postgres
