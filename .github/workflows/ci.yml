name: Staynex CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staynex-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SEND_AUTOMATIONS: 'false'
  USE_MOCK_AI: 'true'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  critical:
    name: Critical tests and syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            dashboard/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix dashboard ci --ignore-scripts --no-audit --no-fund
      - run: npm run ci:critical

  dashboard:
    name: Dashboard build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            dashboard/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix dashboard ci --ignore-scripts --no-audit --no-fund
      - run: npm run ci:dashboard

  postgres:
    name: PostgreSQL knowledge and automation dispatch
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: docker pull postgres:17.10
      - run: npm run ci:postgres
